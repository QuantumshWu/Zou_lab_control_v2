[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlc-runtime"
version = "0.1.0"
description = "Qt-free signal, stream, node-host, and presentation runtime primitives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "zlc-data",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
