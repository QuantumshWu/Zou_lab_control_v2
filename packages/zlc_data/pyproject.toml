[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zlc-data"
version = "0.1.0"
description = "Role-axis data contracts for Zou Lab Control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

# pytest configuration deliberately does NOT live here any more.
#
# In the merged checkout every layer's tests run from the repository root, and
# a [tool.pytest.ini_options] table here would make pytest treat THIS folder as
# the rootdir whenever a single file is run from it -- which skips the root
# conftest, and with it the one entry that puts every layer on the path.  Each
# layer would then see only its own src and fall back to whatever is installed
# for its siblings: the failure with no symptom.
#
# The root pyproject.toml lists every layer's tests.
