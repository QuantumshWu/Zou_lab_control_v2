[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlc-ui"
version = "0.1.0"
description = "Pure, domain-independent PyQt5 controls and views for ZLC applications"
requires-python = ">=3.9"
dependencies = [
    "PyQt5",
    "PyQt5-Frameless-Window",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
