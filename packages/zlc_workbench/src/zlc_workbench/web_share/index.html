<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ZLC · Experiment sharing</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="heading"><strong>ZLC · Experiment sharing</strong><span id="connection" role="status">Not connected</span></div>
    <form id="connection-form" class="row">
      <label for="token">Access key</label><input id="token" type="password" autocomplete="off" placeholder="Use the sharing link or key from the experiment computer" required>
      <button id="connect" class="primary">Connect</button>
    </form>
    <div id="toolbar" class="row" hidden>
      <label for="windows">Window</label><select id="windows" aria-label="Experiment window"></select>
      <button id="control">Take control</button><span id="ownership">Read-only</span>
      <div class="spacer"></div>
      <div class="segmented" aria-label="Local display scale"><button id="fit" aria-pressed="true">Fit</button><button id="actual" aria-pressed="false">100%</button></div>
      <button id="keyboard" aria-expanded="false">Type text</button><button id="disconnect" class="quiet">Disconnect</button>
    </div>
    <p id="error" role="alert" hidden></p>
  </header>
  <main id="viewport" aria-label="Experiment window view">
    <canvas id="screen" tabindex="0" aria-label="Shared experiment window. Take control to interact." hidden></canvas>
    <div id="placeholder"><p id="placeholder-text">Only the experiment application is shared, not the desktop. Connecting does not start or stop an experiment.</p><button id="show-window" hidden>Show window</button></div>
  </main>
  <footer>
    <div id="text-tools" hidden>
      <label for="text-input">Type into the selected field in the experiment window</label>
      <div class="row"><textarea id="text-input" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Select a field in the shared view, then type here"></textarea><button data-key="Backspace">Backspace</button><button data-key="Enter">Enter</button><button data-key="Escape">Esc</button><button data-key="Tab">Tab</button></div>
    </div>
    <span id="hint">This is the same experiment session. All operations run on the experiment computer.</span>
  </footer>
  <script src="/client.js" defer></script>
</body>
</html>
