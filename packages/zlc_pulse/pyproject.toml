[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlc-pulse"
version = "0.1.0"
description = "Minimal pulse-streamer model, compiler, wire image, and device transport"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
